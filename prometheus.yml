global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'api_gateway'
    # Scrapes the Gin server running on the host machine
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'metadata_service'
    # Scrapes the Gin server running on the host machine
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'transcoder_worker'
    # Scrapes the Docker container directly over the bridge network
    static_configs:
      - targets: ['transcoder:8082']
