events {
    worker_connections 1024;
}

http {
    # Load balance across all api_gateway instances
    upstream api_gateway {
        server api_gateway:8080;
    }

    # Load balance across all metadata_service instances
    upstream metadata_service {
        server metadata_service:8081;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Route API requests to the API Gateway cluster
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route Webhooks specifically to metadata service if needed (optional)
        location /api/v1/webhooks/ {
            proxy_pass http://metadata_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route all other requests to the Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
